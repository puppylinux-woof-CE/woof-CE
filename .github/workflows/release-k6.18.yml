name: release-k6.18

on:
  workflow_dispatch:

jobs:
  release:
    if: github.event_name != 'schedule' || (github.repository == 'puppylinux-woof-CE/woof-CE' && github.ref == 'refs/heads/testing')
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - kversion: 6.18
            arch: x86_64
            dirs:
          - kversion: 6.18
            arch: x86_64
            dirs: -usrmerge
          - kversion: 6.18
            arch: x86
            dirs:
          - kversion: 6.18
            arch: x86
            dirs: -usrmerge
    steps:
      - name: Get current date
        id: version
        run: echo "builddate=$(date +'%y%m%d')" >> $GITHUB_OUTPUT
      - name: Download artifact from another workflow
        uses: dawidd6/action-download-artifact@v28
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: kernel-kit-k6.18.yml
          name: kernel-kit-output${{ matrix.dirs }}-${{ matrix.kversion }}.x-${{ matrix.arch }}
          path: .
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Puppy-Kernels-${{ matrix.kversion }}-${{ matrix.arch }}${{ matrix.dirs }}
          tag_name: Puppy-Kernel-${{ matrix.kversion }}-${{ matrix.arch }}${{ matrix.dirs }}/release-${{ steps.version.outputs.builddate }}
          fail_on_unmatched_files: false
          files: |
            *.tar.bz2
            *.txt
            kbuild*
            kernel_sources*
